name: Build and Deploy Janma Kundali

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare static runtime files
        run: |
          mkdir -p dist/data
          cp manifest.webmanifest dist/manifest.webmanifest
          cp sw.js dist/sw.js
          cp -r data/. dist/data/
          touch dist/.nojekyll

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/data/locations.json
          test -f dist/data/nakshatra.json
          test -f dist/data/panchanga.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
