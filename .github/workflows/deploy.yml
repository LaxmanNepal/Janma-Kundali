name: Build Janma Kundali

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: janma-kundali-build
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: npm test

      - name: Build Vite application
        run: npm run build

      - name: Prepare Pages runtime files
        run: |
          mkdir -p dist/data
          cp manifest.webmanifest dist/manifest.webmanifest
          cp sw.js dist/sw.js
          cp -r data/. dist/data/
          touch dist/.nojekyll

      - name: Publish built app to docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r dist/. docs/
          touch docs/.nojekyll

      - name: Commit built application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'chore: publish production build'
          git push origin HEAD:main
